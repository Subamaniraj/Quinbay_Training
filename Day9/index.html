<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blibli</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f4f4;
        }

        .header {
            position: sticky;
            top: 0;
            background-color:#3085ff;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 1000;
            color: white;
        }

        .header input {
            border-radius: 8px;
            border: 1px solid #ccc;
            padding: 5px;
            width: 40%;
            margin-right: 10px;
        }

        .header .filter-inputs {
            display: flex;
            align-items: center;
        }

        .header .filter-inputs label {
            color: white;
            margin-right: 5px;
        }

        .filters {
            display: flex;
            align-items:center;
            background-color: #f0f0f0;
            padding: 10px 40px;
            margin-bottom: 10px;
        }

        .filters label {
            margin-right: 10px;
        }

        .footer {
            background-color:#3085ff;
            text-align: center;
            padding: 10px 20px;
            margin-top: auto;
            color: white;
        }

        .container {
            display: flex;
            flex: 1;
            padding: 20px;
        }

        .form-container {
            position: sticky;
            display: flex;
            flex-direction: column;
            width: 20%;
            margin-right: 20px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            top: 50px; 
            height: calc(100vh - 125px); 
        }

        .form-container h4 {
            margin-bottom: 20px;
            color: #4a148c;
        }

        .form-container label,
        .form-container input,
        .form-container button {
            margin-bottom: 15px;
        }

        .form-container input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            transition: border 0.3s;
        }

        .form-container input:focus {
            border: 1px solid #3085ff;
            outline: none;
        }

        .form-container button {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #3085ff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-container button:hover {
            background-color: #0760de;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 50%;
            height: auto;
        }

        .card {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 7px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-top-left-radius: 7px;
            border-top-right-radius: 7px;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-size: 20px;
            margin: 0 0 10px;
            color:  #3085ff;
        }

        .card-brand, .card-price, .card-ram, .card-rom, .card-quantity {
            font-size: 16px;
            color: #666;
            margin-bottom: 5px;
        }

        .card-price {
            font-weight: bold;
            color: #000;
        }

        .add-to-cart-btn {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #3085ff;
            color: white;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background-color 0.3s;
        }

        .add-to-cart-btn:hover {
            background-color:  #0749a5;
        }

        .cart-container {
            width: 25%;
            margin-left: 20px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 50px; 
            height: calc(100vh - 125px); 
            overflow-y: auto;
        }

        .cart-container h4 {
            color: #4a148c;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }

        .cart-item-details {
            flex: 1;
            margin-left: 10px;
        }

        .remove-btn {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .remove-btn:hover {
            background-color: #c0392b;
        }

        .checkout-btn {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #27ae60;
            color: white;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background-color 0.3s;
        }

        .checkout-btn:hover {
            background-color: #1e8449;
        }

        footer h3 {
            margin: 0;
        }

        @media (max-width: 768px) {
            .form-container {
                width: 100%;
                margin-bottom: 20px;
                position: static;
                height: auto;
            }
            .container {
                flex-direction: column;
            }
            .cards-container {
                grid-template-columns: repeat(2, 1fr);
                width: 100%;
            }
            .cart-container {
                width: 100%;
                margin-left: 0;
                position: static;
                height: auto;
                margin-top: 20px;
            }
        }

        @media (max-width: 480px) {
            .cards-container {
                grid-template-columns: 1fr;
                align-items: center;
                width: 100%;
            }
            .form-container {
                width: 90%;
                margin-bottom: 20px;
                position: static;
                height: auto;
            }
            .filters label{
                font-size: x-small;
                margin: 0 0 0 7px;
            }
         #minPrice{
                 width: 30%;
            }
            #maxPrice{
                 width: 30%;
            }
            .cart-container{
                align-items: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h2><b>Blibli</b></h2>
        <input type="search" id="searchCards" oninput="filterProducts()" placeholder="Search...">
    </header>
    <div class="filters">
        <label for="minPrice">Min Price:</label>
        <input type="number" id="minPrice" oninput="filterProducts()" placeholder="Min Price">
        <label for="maxPrice">Max Price:</label>
        <input type="number" id="maxPrice" oninput="filterProducts()" placeholder="Max Price">
        <label for="availableStock">Available Stock:</label>
        <input type="checkbox" id="availableStock" onchange="filterProducts()">
    </div>
    <div class="container">
        <div class="form-container">
            <h4>Add Product</h4>
            <label for="image">Image URL:</label>
            <input type="url" id="image">
            <label for="title">Title:</label>
            <input type="text" id="title">
            <label for="brand">Brand:</label>
            <input type="text" id="brand">
            <label for="price">Price:</label>
            <input type="number" id="price">
            <label for="ram">RAM:</label>
            <input type="text" id="ram">
            <label for="rom">ROM:</label>
            <input type="text" id="rom">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity">
            <button onclick="addProduct()">Add Product</button>
        </div>
        <div class="cards-container" id="cardsContainer"></div>
        <div class="cart-container">
            <h4>Cart</h4>
            <div id="cartItemsContainer"></div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>
    <footer class="footer">
        <h3>&copy; 2024 Blibli. All rights reserved.</h3>
    </footer>
    <script>
        let products = [];
        let cart = [];

        function addProduct() {
            const image = document.getElementById("image").value;
            const title = document.getElementById("title").value;
            const brand = document.getElementById("brand").value;
            const price = parseFloat(document.getElementById("price").value);
            const ram = document.getElementById("ram").value;
            const rom = document.getElementById("rom").value;
            const quantity = parseInt(document.getElementById("quantity").value, 10);

            if (image && title && brand && !isNaN(price) && ram && rom && !isNaN(quantity)) {
                products.push({ image, title, brand, price, ram, rom, quantity });
                renderProducts();
                document.getElementById("image").value = '';
                document.getElementById("title").value = '';
                document.getElementById("brand").value = '';
                document.getElementById("price").value = '';
                document.getElementById("ram").value = '';
                document.getElementById("rom").value = '';
                document.getElementById("quantity").value = '';
            } else {
                alert('Please fill in all fields correctly.');
            }
        }

        function renderProducts() {
            const container = document.getElementById("cardsContainer");
            container.innerHTML = '';

            products.forEach((product, index) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.title}">
                    <div class="card-content">
                        <h3 class="card-title">${product.title}</h3>
                        <p class="card-brand">Brand: ${product.brand}</p>
                        <p class="card-price">Price: ₹${product.price.toFixed(2)}</p>
                        <p class="card-ram">RAM: ${product.ram}</p>
                        <p class="card-rom">ROM: ${product.rom}</p>
                        <p class="card-quantity">Available: ${product.quantity}</p>
                        <button class="add-to-cart-btn" onclick="addToCart(${index})">Add to Cart</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(index) {
            const product = products[index];
            if (product.quantity > 0) {
                const existingCartItemIndex = cart.findIndex(item => item.product.title === product.title);
                if (existingCartItemIndex >= 0) {
                    if (cart[existingCartItemIndex].quantity < product.quantity) {
                        cart[existingCartItemIndex].quantity += 1;
                    } else {
                        alert('Not enough stock.');
                    }
                } else {
                    cart.push({ product, quantity: 1 });
                }
                product.quantity -= 1;
                renderProducts();
                renderCart();
            } else {
                alert('This product is out of stock.');
            }
        }

        function removeFromCart(index) {
            const cartItem = cart[index];
            const productIndex = products.findIndex(product => product.title === cartItem.product.title);
            products[productIndex].quantity += cartItem.quantity;
            cart.splice(index, 1);
            renderProducts();
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById("cartItemsContainer");
            container.innerHTML = '';

            cart.forEach((cartItem, index) => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "cart-item";
                itemDiv.innerHTML = `
                    <img src="${cartItem.product.image}" alt="${cartItem.product.title}">
                    <div class="cart-item-details">
                        <p>${cartItem.product.title}</p>
                        <p>Quantity: ${cartItem.quantity}</p>
                        <p>Price: $${(cartItem.product.price * cartItem.quantity).toFixed(2)}</p>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
                `;
                container.appendChild(itemDiv);
            });
        }

        function filterProducts() {
            const searchQuery = document.getElementById("searchCards").value.toLowerCase();
            const minPrice = parseFloat(document.getElementById("minPrice").value);
            const maxPrice = parseFloat(document.getElementById("maxPrice").value);
            const availableStock = document.getElementById("availableStock").checked;

            const filteredProducts = products.filter(product => {
                const matchesSearchQuery = product.title.toLowerCase().includes(searchQuery);
                const matchesMinPrice = isNaN(minPrice) || product.price >= minPrice;
                const matchesMaxPrice = isNaN(maxPrice) || product.price <= maxPrice;
                const matchesStock = !availableStock || product.quantity > 0;

                return matchesSearchQuery && matchesMinPrice && matchesMaxPrice && matchesStock;
            });

            const container = document.getElementById("cardsContainer");
            container.innerHTML = '';

            filteredProducts.forEach((product, index) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.title}">
                    <div class="card-content">
                        <h3 class="card-title">${product.title}</h3>
                        <p class="card-brand">Brand: ${product.brand}</p>
                        <p class="card-price">Price: $${product.price.toFixed(2)}</p>
                        <p class="card-ram">RAM: ${product.ram}</p>
                        <p class="card-rom">ROM: ${product.rom}</p>
                        <p class="card-quantity">Available: ${product.quantity}</p>
                        <button class="add-to-cart-btn" onclick="addToCart(${index})">Add to Cart</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Your cart is empty.');
            } else {
                cart = [];
                alert('Checkout successful.');
                renderProducts();
                renderCart();
            }
        }
    </script>
</body>
</html>
